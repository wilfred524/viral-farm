[project]
name = "viralfarm"
version = "0.2.0"
description = "Decide qué contenido producir y lo produce: series verticales para TikTok a partir de video existente"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }

# Dependencias del núcleo. Los adaptadores pesados (whisper, tts, visión) van en extras para
# que el dominio y los tests se instalen sin arrastrar torch ni modelos.
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.15",
]

[project.optional-dependencies]
# Fase 2 en adelante: adaptadores que hablan con el mundo exterior.
adaptadores = [
    "anthropic>=0.40",
    "faster-whisper>=1.1",
    "edge-tts>=7.0",
    "librosa>=0.10",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
viralfarm = "viralfarm.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["viralfarm"]

# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "golden: compara contra artefactos reales del pipeline TypeScript",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001/RUF002/RUF003: el proyecto escribe en español y usa comillas tipográficas y «» a
# propósito en prompts y mensajes; no son homoglifos accidentales.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
# El dominio es puro y debe tipar completo. Los adaptadores hablan con librerías sin stubs.
[[tool.mypy.overrides]]
module = ["librosa.*", "faster_whisper.*", "edge_tts.*"]
ignore_missing_imports = true
